name: Public replication checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12.7'
      - run: julia scripts/instantiate.jl
      - run: julia --project=. scripts/verify_checksums.jl
      - run: julia --project=. test/runtests.jl
      - run: julia --project=. scripts/replay_aggregates.jl --mode recorded --output generated/recorded
  finite-dual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r theory/dual/requirements.txt
      - working-directory: theory/dual
        run: python -m pytest -q -p no:cacheprovider test_rpm_hrep.py test_rpm_consistency.py test_rpm_projection_audit.py
